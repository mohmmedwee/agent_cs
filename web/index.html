<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent console</title>
<style>
  /* No CDN fonts — this is likely running on an isolated network. */
  :root{
    --paper:#EDF0F2; --surface:#fff; --ink:#16202B; --muted:#66788A;
    --line:#D6DDE3; --accent:#2D4A7C; --tool:#1B6B60; --danger:#9B2C2C;
    --ui: ui-sans-serif, "Segoe UI", Roboto, "Noto Sans Arabic", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui);
    font-size:15.5px; line-height:1.6; display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:baseline; gap:.75rem; padding:.85rem 1.25rem;
    border-bottom:1px solid var(--line); background:var(--surface);
  }
  header h1{font-size:.95rem; font-weight:650; margin:0; letter-spacing:-.01em}
  #status{font-family:var(--mono); font-size:.75rem; color:var(--muted); margin-inline-start:auto}
  #status b{font-weight:500; color:var(--ink)}

  main{flex:1; overflow-y:auto; scroll-behavior:smooth}
  .col{max-width:44rem; margin:0 auto; padding:2rem 1.25rem 1rem}

  .empty{color:var(--muted); padding:4rem 0; max-width:32rem}
  .empty p{margin:0 0 1.25rem}
  .seeds{display:flex; flex-wrap:wrap; gap:.5rem}
  .seeds button{
    font:inherit; font-size:.85rem; cursor:pointer; padding:.4rem .7rem;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:.35rem;
  }
  .seeds button:hover{border-color:var(--accent); color:var(--accent)}

  .turn{margin-bottom:1.75rem}
  .turn.user{
    background:var(--surface); border:1px solid var(--line); border-radius:.5rem;
    padding:.7rem .95rem; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .turn.user::before{
    content:"You"; display:block; font-size:.7rem; color:var(--muted); margin-bottom:.2rem;
  }

  /* Tool activity: an inset rule, not another card in a stack of cards. */
  .tool{
    border-inline-start:2px solid var(--tool); margin:.9rem 0; padding-inline-start:.85rem;
  }
  .tool summary{
    cursor:pointer; list-style:none; font-family:var(--mono); font-size:.78rem;
    color:var(--tool); display:flex; align-items:center; gap:.5rem;
  }
  .tool summary::-webkit-details-marker{display:none}
  .tool summary:hover{text-decoration:underline}
  .tool pre{
    font-family:var(--mono); font-size:.76rem; background:var(--surface);
    border:1px solid var(--line); border-radius:.3rem; padding:.55rem .7rem;
    margin:.5rem 0 0; overflow-x:auto; white-space:pre-wrap; overflow-wrap:anywhere;
    direction:ltr; text-align:left;
  }
  .tool .lbl{font-size:.7rem; color:var(--muted); margin-top:.55rem}
  .think{
    border-inline-start:2px solid var(--line); margin:.9rem 0; padding-inline-start:.85rem;
  }
  .think summary{
    cursor:pointer; list-style:none; font-family:var(--mono); font-size:.78rem;
    color:var(--muted); display:flex; align-items:center; gap:.5rem;
  }
  .think summary::-webkit-details-marker{display:none}
  .think summary:hover{text-decoration:underline}
  .think .body{
    font-size:.78rem; color:var(--muted); margin-top:.5rem; white-space:pre-wrap;
    overflow-wrap:anywhere; max-height:11rem; overflow-y:auto;
  }
  .think .spin{border-color:var(--muted); border-top-color:transparent}
  .spin{
    width:.6rem; height:.6rem; border:1.5px solid var(--tool); border-top-color:transparent;
    border-radius:50%; animation:sp .7s linear infinite; flex:none;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none; border-top-color:var(--tool); opacity:.4} }

  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md p{margin:0 0 .8rem}
  .md ul,.md ol{margin:0 0 .8rem; padding-inline-start:1.3rem}
  .md h1,.md h2,.md h3{font-size:1rem; margin:1.2rem 0 .5rem; line-height:1.35}
  .md code{
    font-family:var(--mono); font-size:.86em; background:#E3E8EC;
    padding:.1em .3em; border-radius:.2rem;
  }
  .md pre{
    background:var(--ink); color:#E8EDF2; padding:.8rem .9rem; border-radius:.4rem;
    overflow-x:auto; margin:0 0 .8rem; direction:ltr; text-align:left;
  }
  .md pre code{background:none; padding:0; color:inherit; font-size:.82rem; line-height:1.55}
  .md a{color:var(--accent)}
  .caret{
    display:inline-block; width:.5em; height:1em; background:var(--muted);
    vertical-align:text-bottom; animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .err{color:var(--danger); font-size:.85rem; border-inline-start:2px solid var(--danger); padding-inline-start:.85rem}

  footer{border-top:1px solid var(--line); background:var(--surface); padding:.85rem 1.25rem}
  .bar{max-width:44rem; margin:0 auto; display:flex; gap:.6rem; align-items:flex-end}
  textarea{
    flex:1; font:inherit; resize:none; padding:.6rem .75rem; max-height:11rem;
    border:1px solid var(--line); border-radius:.45rem; background:var(--surface); color:inherit;
  }
  textarea:focus-visible, .seeds button:focus-visible, #send:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  #send{
    font:inherit; font-size:.9rem; cursor:pointer; padding:.6rem 1.1rem;
    border:1px solid transparent; border-radius:.45rem;
    background:var(--accent); color:#fff;
  }
  #send.stop{background:var(--surface); color:var(--danger); border-color:var(--danger)}
  .hint{max-width:44rem; margin:.45rem auto 0; font-size:.72rem; color:var(--muted)}

  #attach{
    font:inherit; font-size:.9rem; cursor:pointer; padding:.6rem .8rem;
    border:1px solid var(--line); border-radius:.45rem;
    background:var(--surface); color:var(--muted);
  }
  #attach:hover{border-color:var(--accent); color:var(--accent)}
  #attach:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  #attach[disabled]{opacity:.5; cursor:default}

  /* Attached files: what the agent can reach, not a preview of the message. */
  .files{
    max-width:44rem; margin:0 auto .5rem; display:flex; flex-wrap:wrap; gap:.4rem;
  }
  .files:empty{display:none}
  .chip{
    display:inline-flex; align-items:center; gap:.4rem; font-size:.75rem;
    font-family:var(--mono); background:var(--paper); color:var(--ink);
    border:1px solid var(--line); border-radius:.3rem; padding:.25rem .5rem;
    direction:ltr;
  }
  .chip .sz{color:var(--muted)}
  .chip.bin{border-style:dashed; color:var(--muted)}

  /* Drop target covers the viewport so a drag anywhere lands. */
  #drop{
    position:fixed; inset:0; z-index:10; display:none;
    background:rgba(45,74,124,.08); border:2px dashed var(--accent);
    align-items:center; justify-content:center;
    font-size:.95rem; color:var(--accent); font-weight:600;
  }
  #drop.on{display:flex}
</style>
</head>
<body>

<header>
  <h1>Agent console</h1>
  <span id="status">connecting…</span>
</header>

<main><div class="col" id="thread">
  <div class="empty" id="empty">
    <p>Ask something. Tool calls appear inline as the model makes them, so you can see what the loop actually did.</p>
    <div class="seeds">
      <button>What time is it in Dubai?</button>
      <button>What's 15% of 4,280 plus 90?</button>
      <button>كم الساعة الآن في عمّان؟</button>
    </div>
  </div>
</div></main>

<div id="drop">Drop files to attach</div>

<footer>
  <div class="files" id="files"></div>
  <div class="bar">
    <input type="file" id="picker" multiple hidden>
    <button id="attach" title="Attach files">Attach</button>
    <textarea id="input" rows="1" placeholder="Send a message" dir="auto"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">Enter to send, Shift+Enter for a new line. Attached files are read by the agent on request.</div>
</footer>

<script>
const thread = document.getElementById('thread');
const input  = document.getElementById('input');
const send   = document.getElementById('send');
const empty  = document.getElementById('empty');

let history = [];      // what we replay to the server
let controller = null; // in-flight request

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Minimal markdown. Deliberately no library: this may run air-gapped. */
function md(src){
  const blocks = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `\u0000${blocks.push(`<pre><code>${esc(code.replace(/\n$/,''))}</code></pre>`) - 1}\u0000`);

  s = esc(s)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const out = [];
  for (const para of s.split(/\n{2,}/)){
    const t = para.trim();
    if (!t) continue;
    if (/^\u0000\d+\u0000$/.test(t)) { out.push(t); continue; }
    let m;
    if ((m = t.match(/^(#{1,3})\s+(.*)$/m)) && t.startsWith('#')){
      out.push(`<h${m[1].length} dir="auto">${m[2]}</h${m[1].length}>`); continue;
    }
    if (/^\s*[-*]\s+/.test(t)){
      out.push(`<ul dir="auto">` + t.split('\n').map(l =>
        `<li>${l.replace(/^\s*[-*]\s+/,'')}</li>`).join('') + `</ul>`); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(t)){
      out.push(`<ol dir="auto">` + t.split('\n').map(l =>
        `<li>${l.replace(/^\s*\d+[.)]\s+/,'')}</li>`).join('') + `</ol>`); continue;
    }
    out.push(`<p dir="auto">${t.replace(/\n/g,'<br>')}</p>`);
  }
  // dir="auto" per block, never on the container — otherwise code and lists
  // inherit RTL from surrounding Arabic and break.
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

const el = (tag, cls, parent) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  (parent || thread).appendChild(n);
  return n;
};
const atBottom = () => {
  const m = document.querySelector('main');
  return m.scrollHeight - m.scrollTop - m.clientHeight < 120;
};
const stick = () => { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; };

function pretty(json){
  try { return JSON.stringify(JSON.parse(json), null, 2); } catch { return json; }
}

async function ask(text){
  if (!text.trim() || controller) return;
  empty?.remove();

  const u = el('div', 'turn user');
  u.textContent = text;
  u.setAttribute('dir', 'auto');
  history.push({role:'user', content:text});
  input.value = ''; input.style.height = 'auto';
  stick();

  const turn = el('div', 'turn');
  let bubble = null, buffer = '';
  const pending = new Map();

  const flush = () => {
    if (!bubble) bubble = el('div', 'md', turn);
    bubble.innerHTML = md(buffer) + '<span class="caret"></span>';
  };

  // A reasoning model can think for minutes before its first visible token.
  // Stream that thinking into a collapsed block so the UI is never silent.
  let think = null, thinkAt = 0;

  const thinkDelta = (text) => {
    if (!think){
      thinkAt = Date.now();
      think = el('details', 'think', turn);
      think.innerHTML =
        '<summary><span class="spin"></span><span class="cap">Thinking…</span></summary>' +
        '<div class="body"></div>';
    }
    const body = think.querySelector('.body');
    body.textContent += text;
    body.scrollTop = body.scrollHeight;
  };

  const thinkDone = () => {
    if (!think) return;
    const secs = Math.max(1, Math.round((Date.now() - thinkAt) / 1000));
    think.querySelector('.spin')?.remove();
    think.querySelector('.cap').textContent = `Thought for ${secs}s`;
    think = null;
  };

  controller = new AbortController();
  send.textContent = 'Stop'; send.classList.add('stop');

  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history}),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`server returned ${res.status}`);

    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let carry = '';

    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      carry += value;
      const frames = carry.split('\n\n');
      carry = frames.pop();

      for (const frame of frames){
        if (!frame.startsWith('data: ')) continue;
        const ev = JSON.parse(frame.slice(6));
        const glued = atBottom();

        if (ev.type === 'text_delta'){
          thinkDone();
          buffer += ev.text; flush();

        } else if (ev.type === 'reasoning_delta'){
          thinkDelta(ev.text);

        } else if (ev.type === 'tool_call'){
          thinkDone();
          buffer = ''; bubble = null;           // next text starts a fresh block
          const d = el('details', 'tool', turn);
          d.innerHTML =
            `<summary><span class="spin"></span><span>${esc(ev.name)}</span></summary>` +
            `<div class="lbl">Arguments</div><pre>${esc(pretty(ev.arguments))}</pre>`;
          pending.set(ev.id, d);

        } else if (ev.type === 'tool_result'){
          const d = pending.get(ev.id);
          if (d){
            d.querySelector('.spin').remove();
            const bad = ev.result.startsWith('Error:');
            d.querySelector('summary span').textContent =
              ev.name + (bad ? ' — failed' : ' — done');
            if (bad) d.open = true;
            d.insertAdjacentHTML('beforeend',
              `<div class="lbl">Result</div><pre>${esc(ev.result)}</pre>`);
          }

        } else if (ev.type === 'error'){
          thinkDone();
          const e = el('div', 'err', turn);
          e.textContent = ev.message;
        }
        if (glued) stick();
      }
    }

    if (bubble) bubble.innerHTML = md(buffer);
    if (buffer) history.push({role:'assistant', content:buffer});

  } catch (e){
    if (e.name === 'AbortError'){
      if (bubble) bubble.innerHTML = md(buffer);
      if (buffer) history.push({role:'assistant', content:buffer});
    } else {
      el('div', 'err', turn).textContent = e.message;
    }
  } finally {
    thinkDone();
    controller = null;
    send.textContent = 'Send'; send.classList.remove('stop');
    input.focus();
  }
}

send.onclick = () => controller ? controller.abort() : ask(input.value);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(input.value); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 176) + 'px';
});
document.querySelectorAll('.seeds button').forEach(b =>
  b.onclick = () => ask(b.textContent));

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('status').innerHTML =
    h.ok ? `<b>${esc(h.model)}</b>` : `<b style="color:var(--danger)">upstream unreachable</b>`;
}).catch(() => {});

/* ---- attachments -------------------------------------------------------
   Uploading is independent of sending: a file goes to the server, and the
   agent reaches it through its tools when a message makes it relevant. The
   chips show what the agent can currently see, not what this message carries.
------------------------------------------------------------------------ */
const picker  = document.getElementById('picker');
const attach  = document.getElementById('attach');
const chips   = document.getElementById('files');
const dropzone = document.getElementById('drop');

const kb = n => n < 1024 ? `${n} B` : `${(n/1024).toFixed(n < 10240 ? 1 : 0)} KB`;

function renderFiles(list){
  chips.innerHTML = list.map(f =>
    `<span class="chip${f.is_text ? '' : ' bin'}" title="${esc(f.is_text
        ? 'Readable as text' : 'Binary — the agent can see the name and size only')}">`
    + `${esc(f.name)} <span class="sz">${kb(f.size)}</span></span>`
  ).join('');
}

async function refreshFiles(){
  try{
    const r = await fetch('/api/files');
    if (r.ok) renderFiles((await r.json()).files);
  } catch {}
}

async function upload(fileList){
  const picked = [...fileList];
  if (!picked.length) return;

  const body = new FormData();
  for (const f of picked) body.append('files', f);

  attach.disabled = true;
  attach.textContent = 'Uploading…';
  try{
    const r = await fetch('/api/files', { method:'POST', body });
    if (!r.ok){
      const detail = await r.text();
      el('div', 'err').textContent =
        r.status === 413 ? 'File is too large.' : `Upload failed (${r.status}). ${detail.slice(0,200)}`;
      stick();
    } else {
      // The response carries only this batch; refetch for the full set.
      await refreshFiles();
    }
  } catch (e){
    el('div', 'err').textContent = `Upload failed: ${e.message}`;
    stick();
  } finally {
    attach.disabled = false;
    attach.textContent = 'Attach';
    picker.value = '';
  }
}

attach.onclick = () => picker.click();
picker.onchange = () => upload(picker.files);

let dragDepth = 0;
addEventListener('dragenter', e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); dragDepth++; dropzone.classList.add('on');
});
addEventListener('dragover', e => {
  if ([...e.dataTransfer.types].includes('Files')) e.preventDefault();
});
addEventListener('dragleave', () => {
  if (--dragDepth <= 0){ dragDepth = 0; dropzone.classList.remove('on'); }
});
addEventListener('drop', e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  dragDepth = 0; dropzone.classList.remove('on');
  upload(e.dataTransfer.files);
});

refreshFiles();
input.focus();
</script>
</body>
</html>
