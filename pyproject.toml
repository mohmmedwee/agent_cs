[project]
name = "agent-console"
version = "0.1.0"
description = "An agent loop over a self-hosted OpenAI-compatible endpoint, with a UI that shows the loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ddgs>=9.0",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "redis>=5.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agent-console = "agent_console.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_console"]

[tool.fastapi]
entrypoint = "agent_console.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "db: needs a running Postgres (TEST_DATABASE_URL); skipped otherwise",
    "soffice: needs LibreOffice on PATH; skipped otherwise",
    "slow: long-running (LibreOffice conversion or live EDIT_DOCX_E2E=1 agent suite); exclude with -m 'not slow'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
