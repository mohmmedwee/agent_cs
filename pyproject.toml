[project]
name = "agent-console"
version = "0.1.0"
description = "An agent loop over a self-hosted OpenAI-compatible endpoint, with a UI that shows the loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ddgs>=9.0",
]

[project.scripts]
agent-console = "agent_console.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_console"]

[tool.fastapi]
entrypoint = "agent_console.main:app"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
